<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Welcome</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="gate" class="card">
    <h1>Welcome</h1>
    <p>Please enter the password to continue.</p>
    <form id="gate-form" autocomplete="off">
      <input id="password" type="password" placeholder="Password" aria-label="Password" required autofocus>
      <button type="submit">Enter</button>
    </form>
    <p id="error" class="error" role="alert" hidden>Incorrect password. Please try again.</p>
  </main>

  <main id="content" class="card" hidden></main>

  <script src="payload.js"></script>
  <script src="script.js"></script>
</body>
</html>
